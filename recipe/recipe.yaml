context:
  name: git-pkgs
  version: "0.22.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/git-pkgs/git-pkgs/archive/refs/tags/v${{ version }}.tar.gz
  sha256: baed53b93bd3bfe4bf97cfcde5ecce4bec841825eea8e4030b51ef543c2a09ef

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - git-pkgs --version
      - git-pkgs --help
  - package_contents:
      bin:
        - git-pkgs
      files:
        - if: unix
          then:
            - share/man/man1/git-pkgs.1
            - share/man/man1/git-pkgs-*.1
      strict: true

about:
  homepage: https://git-pkgs.dev
  summary: A git subcommand for analyzing package/dependency usage in git repositories over time
  description: |
    A git subcommand for tracking package dependencies across git history.
    Analyzes your repository to show when dependencies were added, modified,
    or removed, who made those changes, and why. 
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  repository: https://github.com/git-pkgs/git-pkgs
  documentation: https://git-pkgs.dev

extra:
  recipe-maintainers:
    - soapy1
